<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKS</title>
    <style>
        /* SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: palevioletred;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: lightpink;
        }

        a:hover {
            color: lightgreen;
            text-decoration: underline;
        }

        a:active {
            color:lightsteelblue
        }

        .especial {
            background-color: brown;
        }

        .especial::before{
            content: '⇒' ;
        }

         .especial::after{
            content: '⇐' ;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositorio GitHub</a></li>
        <li><a href="https://youtube.com/CursoemVídeo/">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" class="especial">Site do CursoemVídeo</a></li>
    </ul>
</body>
</html>
