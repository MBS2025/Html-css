<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir essas imagens em vários dispositivos diferentes ou simplesmente diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagemp.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagemm.png" type="image/png">
        <img src="imagens/imagemg.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
   <p>Vamos aprender a reproduzir áudio em HTML5</p>
   <audio preload="metadata" autoplay controls loop>
      <source src="midia/happy-mistake.mp3" type="audio/mpeg">
      <source src="midia/happy-mistake.mp3" type="audio/ogg">
      <source src="midia/happy-mistake.mp3" type="audio/wav">
      <p>Infelizmente seu navegador não pode reproduzir audio <a href="midia/happy-mistake.mp3">Clique aqui para baixar o arquivo MP3</a></p>
   </audio>
</body>
</html>
