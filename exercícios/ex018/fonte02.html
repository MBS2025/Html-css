<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fonts/love larry ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
               Tipos de format
               - opentype(otf)
               - truetype(ttf)
               - embedded-opentype
               - truetype-aat (Apple Advanced 
               Typography)
               - svg
            */
        }
        head {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
   <h1>Título</h1>
   <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Itaque animi reprehenderit eaque fugiat optio ea laborum maiores iusto fugit autem, provident illum cum, a numquam neque quam laudantium dolores tenetur!</p> 
</body>
</html>
