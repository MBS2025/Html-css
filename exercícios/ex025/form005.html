<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="Sexo" id="isxmasc" value="M"> <label for="isxmasc"> Masculino</label><br>
            <input type="radio" name="Sexo" id="isxfem" value="F"> <label for="isxfem"> Feminino</label><br>
        </fieldset>

        <!--Todos os botões de radio que fazem parte do mesmo grupo devem ter o mesmo name-->
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked><label for="iesfut"> Futebol</label>
            <input type="checkbox" name="esbasq" id="iesbas"> <label for="iesbas">Basquete</label>
            <input type="checkbox" name="esvol" id="iesvol"> <label for="iesvol">Vôlei</label>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
